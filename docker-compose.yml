# ==============================================================================
# Cheat Clip PRO — Docker Compose (Coolify "Docker Compose" build pack ready)
#
#   frontend  -> nginx: serves the React SPA and reverse-proxies /api -> backend
#   backend   -> FastAPI + FFmpeg + yt-dlp + Whisper (video download/render)
#   mcp       -> Model Context Protocol server for AI agents (optional)
#
# IMPORTANT — Coolify routing:
#   The frontend is the public web entrypoint. In Coolify:
#     Domains -> Add domain -> Service = "frontend", Internal port = 80
#   To expose the MCP server to a remote agent, add a SECOND domain pointing at
#   Service = "mcp", Internal port = 8765 (protect it — see mcp/README.md).
#   The backend stays private (reached over the Compose network as backend:8000).
#   `frontend` is listed first so Coolify's default domain maps to it.
# Built natively for linux/arm64 and linux/amd64 — no emulation required.
# ==============================================================================
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8000
    # Host port is only for local `docker compose up`. In Coolify, routing is
    # done through Domains (Service = frontend, Internal port = 80).
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      # Server
      HOST: 0.0.0.0
      PORT: "8000"
      ENVIRONMENT: production
      SERVER_MODE: "true"
      # AI / transcript providers (all optional — users can also paste a key in the UI)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SUPADATA_API_KEYS: ${SUPADATA_API_KEYS:-}
      # Residential proxy to bypass YouTube datacenter-IP bans (either a full
      # proxy URL, or Webshare rotating credentials).
      WEBSHARE_PROXY: ${WEBSHARE_PROXY:-}
      PROXY_URL: ${PROXY_URL:-}
      WEBSHARE_USERNAME: ${WEBSHARE_USERNAME:-}
      WEBSHARE_PASSWORD: ${WEBSHARE_PASSWORD:-}
      WEBSHARE_LOCATIONS: ${WEBSHARE_LOCATIONS:-}
      WEBSHARE_RETRIES: ${WEBSHARE_RETRIES:-5}
      # Lock down admin/system endpoints with a token for public deployments.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # Dashboard login gate. Set BOTH to require a login; leave empty to keep
      # the dashboard open (e.g. local/desktop use).
      DASHBOARD_LOGIN_USERNAME: ${DASHBOARD_LOGIN_USERNAME:-}
      DASHBOARD_LOGIN_PASSWORD: ${DASHBOARD_LOGIN_PASSWORD:-}
      # Optional fixed secret for session tokens (recommended in production so
      # logins survive restarts). Falls back to a value derived from the password.
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET:-}
      # Programmatic access key for the MCP server / API clients. When set, the
      # API accepts "Authorization: Bearer <key>" or "X-API-Key: <key>".
      MCP_API_KEY: ${MCP_API_KEY:-}
      # Server-default YouTube cookies used when the browser sends none.
      # Provide raw cookie content, or a mounted file path.
      YOUTUBE_COOKIES: ${YOUTUBE_COOKIES:-}
      YOUTUBE_COOKIES_FILE: ${YOUTUBE_COOKIES_FILE:-}
      # CORS — only needed if the SPA is served from a different origin than /api.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Automatic temp storage cleanup (TTL + storage quota).
      TEMP_MAX_AGE_SECONDS: ${TEMP_MAX_AGE_SECONDS:-3600}
      TEMP_STORAGE_QUOTA_GB: ${TEMP_STORAGE_QUOTA_GB:-5.0}
      CLEANUP_INTERVAL_SECONDS: ${CLEANUP_INTERVAL_SECONDS:-1800}
      # Keep CPU/thread usage friendly on small shared servers.
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-2}
    volumes:
      - media_temp:/app/backend/temp_clips
      - media_temp_legacy:/app/backend/temp
      - media_exports:/app/backend/exports
      - custom_fonts:/app/backend/fonts
    # No public domain and no published host port: the backend is internal only.
    # Resource guards. Raise BACKEND_MEM_LIMIT if your server has more than
    # ~4 GB RAM (long videos + Whisper are memory hungry); keep it below the
    # host RAM so the Coolify proxy and OS stay responsive.
    mem_limit: ${BACKEND_MEM_LIMIT:-3g}
    memswap_limit: ${BACKEND_MEM_LIMIT:-3g}
    cpus: ${BACKEND_CPUS:-3}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Reaches the backend over the private Compose network (no public hop).
      CCP_BASE_URL: http://backend:8000
      # Must match the backend's MCP_API_KEY so the agent can authenticate.
      MCP_API_KEY: ${MCP_API_KEY:-}
      CCP_MCP_TRANSPORT: streamable-http
      CCP_MCP_HOST: 0.0.0.0
      CCP_MCP_PORT: "8765"
      CCP_OUTPUT_DIR: /data
    volumes:
      - mcp_output:/data
    # No published port: expose via Coolify Domains (Service = mcp, port 8765).
    expose:
      - "8765"
    mem_limit: ${MCP_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), 2).close()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  media_temp:
  media_temp_legacy:
  media_exports:
  custom_fonts:
  mcp_output:
